# docker/compose.yaml
services:
  wires-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-host
    image: wires-host:local
    container_name: wires-host
    network_mode: host
    volumes:
      - wires-host-data:/data
    restart: unless-stopped
    environment:
      RUST_LOG: "warn,wires_host=info,wires_net=info,wires_node=info"
    # Override the binary's default --http-bind so the ticket HTTP page
    # lives on the wires namespace port range (10000+) and binds to
    # 127.0.0.1 only — Tailscale Funnel's :10000 listener takes the Tailnet
    # IP on the same port, so a wildcard bind here would AddrInUse.
    # Funnel proxies `<tailnet-ip>:10000` → `127.0.0.1:10000`.
    command: ["--data-dir", "/data", "--http-bind", "127.0.0.1:10000"]
    stop_signal: SIGINT
    stop_grace_period: 10s

  wires-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-mcp
    image: wires-mcp:local
    container_name: wires-mcp
    network_mode: host
    volumes:
      - wires-mcp-data:/data
      # Operator-edited TOML mounted read-only so the binary can't
      # accidentally overwrite the operator's edits.
      - ./wires-mcp.toml:/etc/wires-mcp/config.toml:ro
    restart: unless-stopped
    environment:
      WIRES_MCP_CONFIG: /etc/wires-mcp/config.toml
      # `wires_mcp::http=debug` enables the OAuth request/response logger
      # added for first-time MCP-client debugging. Drop it back to info
      # (or remove that target) once the OAuth flow is verified — request
      # and response bodies may contain short-lived secrets (auth codes,
      # PKCE verifiers, refresh tokens).
      RUST_LOG: "info,wires_mcp=info,wires_mcp::http=debug"
    stop_signal: SIGINT
    stop_grace_period: 10s

volumes:
  wires-host-data:
    name: wires-host-data
  wires-mcp-data:
    name: wires-mcp-data
