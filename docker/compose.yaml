# docker/compose.yaml
services:
  wires-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-host
    image: wires-host:local
    container_name: wires-host
    network_mode: host
    volumes:
      - wires-host-data:/data
    restart: unless-stopped
    environment:
      RUST_LOG: "warn,wires_host=info,wires_net=info,wires_node=info"
    # Override the binary's default --http-bind (0.0.0.0:8089) so the ticket
    # HTTP page lives on the wires namespace port range (10000+). 10001+ is
    # reserved for future wires-* services (wires-mcp, etc.).
    command: ["--data-dir", "/data", "--http-bind", "0.0.0.0:10000"]
    stop_signal: SIGINT
    stop_grace_period: 10s

  wires-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-mcp
    image: wires-mcp:local
    container_name: wires-mcp
    network_mode: host
    volumes:
      - wires-mcp-data:/data
      # Operator-edited TOML mounted read-only so the binary can't
      # accidentally overwrite the operator's edits.
      - ./wires-mcp.toml:/etc/wires-mcp/config.toml:ro
    restart: unless-stopped
    environment:
      WIRES_MCP_CONFIG: /etc/wires-mcp/config.toml
      # RUST_LOG is documentation-only today — wires-mcp's main.rs hardcodes
      # the filter to "info". Setting it anticipates a future binary fix.
      RUST_LOG: "info,wires_mcp=info"
    stop_signal: SIGINT
    stop_grace_period: 10s

volumes:
  wires-host-data:
    name: wires-host-data
  wires-mcp-data:
    name: wires-mcp-data
