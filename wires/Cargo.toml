[package]
name = "wires"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wires"
path = "main.rs"

[features]
# Hidden `wires dev-mock-idp` (hermetic OIDC issuer) for the demo script:
# `cargo build --features dev-mock-idp`. Never in a release or the image.
dev-mock-idp = []

[dependencies]
library = { workspace = true }
clap = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
url = { workspace = true }
jaq-core = { workspace = true }
jaq-std = { workspace = true }
jaq-json = { workspace = true }
# `wires gateway` (card 30): the HTTP server for remote MCP + OAuth. Rides
# the hyper/tower already in the graph via reqwest; only axum itself is new.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }

[dev-dependencies]
proptest = { workspace = true }

[target."cfg(unix)".dependencies]
libc = "0.2"
