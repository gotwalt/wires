[workspace]
resolver = "2"
members = [
    "library",
    "wires",
    "relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
library = { path = "library" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
blake3 = "1"
proptest = "1"
iroh = "1.0.3"
iroh-relay = { version = "1.0.3", features = ["server"] }
iroh-gossip = "0.101"
redb = "4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# IdP login (board card 04). All four are already in the graph via iroh, so no
# new crates are compiled: `ring` verifies RS256/ES256 ID tokens (library) and
# hashes the PKCE verifier (wires); `reqwest` (iroh builds it with
# `rustls-no-provider`) does OIDC discovery / JWKS / token exchange, with
# rustls's `ring` provider installed explicitly; `url` builds the auth URL and
# form bodies.
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
