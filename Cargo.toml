[workspace]
resolver = "2"
members = [
    "library",
    "src",
    "relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
library = { path = "library" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
