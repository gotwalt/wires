[workspace]
resolver = "3"
members = [
    "crates/wires-core",
    "crates/wires-crypto",
    "crates/wires-store",
    "crates/wires-net",
    "crates/wires-node",
    "crates/wires-cli",
    "crates/wires-host",
    "crates/wires-ha",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal
wires-core   = { path = "crates/wires-core" }
wires-crypto = { path = "crates/wires-crypto" }
wires-store  = { path = "crates/wires-store" }
wires-net    = { path = "crates/wires-net" }
wires-node   = { path = "crates/wires-node" }
wires-host   = { path = "crates/wires-host" }

# Iroh
iroh        = "0.98"
iroh-gossip = "0.98"

# Crypto
ed25519-dalek    = { version = "2", features = ["rand_core"] }
x25519-dalek     = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake3           = "1"
rand             = "0.10"

# Storage
redb = "4"

# Serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
hex        = { version = "0.4", features = ["serde"] }
base64     = "0.22"
uuid       = { version = "1", features = ["v4", "serde"] }
toml       = "0.8"

# Runtime
tokio   = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
snafu = { version = "0.9", features = ["futures"] }

# Dev
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
