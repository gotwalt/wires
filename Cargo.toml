[workspace]
resolver = "2"
members = [
    "crates/wires-core",
    "crates/wires",
    "crates/wires-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wires-core = { path = "crates/wires-core" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
