[workspace]
resolver = "2"
members = [
    "library",
    "wires",
]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
library = { path = "library" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
blake3 = "1"
proptest = "1"
iroh = "1.0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# IdP login (board card 04). All four are already in the graph via iroh, so no
# new crates are compiled: `ring` verifies RS256/ES256 ID tokens (library) and
# hashes the PKCE verifier (wires); `reqwest` (iroh builds it with
# `rustls-no-provider`) does OIDC discovery / JWKS / token exchange, with
# rustls's `ring` provider installed explicitly; `url` builds the auth URL and
# form bodies.
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
# `wires call --jq` (board card 19): jq filters evaluated in-process, so an
# agent can shape remote output without a shell. jaq is the pure-Rust jq
# (no C; jaq-core forbids unsafe). Default features: `jaq_std::funs()` only
# exists with all of them, and they bring the date (`fromdateiso8601`, via
# jiff) and regex (`test`, via regex-bites) filters agents reach for with
# `gh --jq`. The new crates are small and pure Rust.
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"
