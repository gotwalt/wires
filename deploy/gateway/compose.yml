# `wires gateway` behind a Cloudflare Tunnel: the services each signed-in
# user may call, as a remote MCP server at https://$WIRES_GATEWAY_HOST/mcp
# (add it in Claude as a custom connector). See docs/deployment.md
# § "A web gateway".
#
#   cp .env.example .env            # fill it in (never commit it)
#   docker compose build
#   docker compose run --rm wires-gateway join <network>   # the admin's `wires network`
#   docker compose up -d
#
# The gateway holds no credential of its own: each call carries the web
# user's ID token. It asks a directory for each user's view, so its network
# needs one (named with `wires directory add`, and in the network string the
# gateway joined with). If no host runs it, run it here as its own node: the
# optional `wires-directory` service (`--profile directory`), with its own
# keystore (`docker compose run --rm wires-directory id` for the admin's
# `wires directory add <label>=<id>`, then `... wires-directory join
# <network>`); see docs/deployment.md § "Running a directory".
#
# The tunnel's ingress (in positivesum/infra) routes the public host to
# http://wires-gateway:8080 on this project's network; nothing is published
# on the Docker host.
name: wires

services:
  wires-gateway:
    build:
      context: ../..
    image: wires:gateway
    # cloudflared sets CF-Connecting-IP; the rate limit keys on it.
    command: ["gateway", "--listen", "0.0.0.0:8080", "--trust-proxy-header"]
    environment:
      WIRES_HOME: /data
      WIRES_GATEWAY_URL: https://${WIRES_GATEWAY_HOST}
      WIRES_GATEWAY_CLIENT_ID: ${WIRES_GATEWAY_CLIENT_ID}
      WIRES_GATEWAY_CLIENT_SECRET: ${WIRES_GATEWAY_CLIENT_SECRET}
      RUST_LOG: ${RUST_LOG:-warn,wires=info}
    volumes:
      # The gateway's keystore: node key, the network string (network.json),
      # DCR key, sessions. Must persist (the node key is the gateway's
      # identity).
      - keystore:/data
    restart: unless-stopped

  # Optional: a directory on this machine, as a node of its own (the gateway
  # never uses its own node as its directory). Start with --profile directory.
  wires-directory:
    profiles: [directory]
    build:
      context: ../..
    image: wires:gateway
    command: ["directory", "serve"]
    environment:
      WIRES_HOME: /data
      RUST_LOG: ${RUST_LOG:-warn,wires=info}
    volumes:
      # Node key, the network string and the signed policy (the directory's store).
      # Must persist.
      - directory-keystore:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${WIRES_TUNNEL_TOKEN}
    depends_on: [wires-gateway]
    restart: unless-stopped

volumes:
  keystore:
  directory-keystore:
