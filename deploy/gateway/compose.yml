# `wires gateway` behind a Cloudflare Tunnel: the services each signed-in
# user may call, as a remote MCP server at https://$WIRES_GATEWAY_HOST/mcp
# (add it in Claude as a custom connector). See docs/deployment.md
# § "A web gateway".
#
#   cp .env.example .env            # fill it in (never commit it)
#   docker compose build
#   docker compose run --rm wires-gateway id          # send the id to the admin
#   docker compose run --rm wires-gateway join <token>
#   docker compose up -d
#
# The gateway asks a directory for each user's view, so its network needs one
# (named with `wires directory add` before the gateway is invited). If no
# host runs it, run it here as its own node: the optional `wires-directory`
# service (`--profile directory`), with its own keystore; see
# docs/deployment.md § "Running a directory".
#
# The tunnel's ingress (in positivesum/infra) routes the public host to
# http://wires-gateway:8080 on this project's network; nothing is published
# on the Docker host.
name: wires

services:
  wires-gateway:
    build:
      context: ../..
    image: wires:gateway
    # cloudflared sets CF-Connecting-IP; the rate limit keys on it.
    command: ["gateway", "--listen", "0.0.0.0:8080", "--trust-proxy-header"]
    environment:
      WIRES_HOME: /data
      WIRES_GATEWAY_URL: https://${WIRES_GATEWAY_HOST}
      WIRES_GATEWAY_CLIENT_ID: ${WIRES_GATEWAY_CLIENT_ID}
      WIRES_GATEWAY_CLIENT_SECRET: ${WIRES_GATEWAY_CLIENT_SECRET}
      RUST_LOG: ${RUST_LOG:-warn,wires=info}
    volumes:
      # The gateway's keystore: node key, badge, the invite's directory ids and
      # login settings, DCR key, sessions. Must persist (the node key is the
      # gateway's identity).
      - keystore:/data
    restart: unless-stopped

  # Optional: a directory on this machine, as a node of its own (the gateway
  # never uses its own node as its directory). Start with --profile directory.
  wires-directory:
    profiles: [directory]
    build:
      context: ../..
    image: wires:gateway
    command: ["directory", "serve"]
    environment:
      WIRES_HOME: /data
      RUST_LOG: ${RUST_LOG:-warn,wires=info}
    volumes:
      # Node key, badge, the signed policy and directory.redb. Must persist.
      - directory-keystore:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${WIRES_TUNNEL_TOKEN}
    depends_on: [wires-gateway]
    restart: unless-stopped

volumes:
  keystore:
  directory-keystore:
