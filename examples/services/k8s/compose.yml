# The `k8s` example as a container: `wires serve` and kubectl, as the
# unprivileged user `wires`. See README.md.
#
#   (cd ../../.. && make image)                 # once: the wires image (wires:dev)
#   cp <your cluster's CA> k8s-ca.crt
#   docker compose build
#   docker compose run --rm k8s join <network>  # the admin's `wires network`
#   docker compose run --rm k8s serve --check /etc/wires-examples/host.json
#   docker compose up -d
#
# No cluster credential and no secret: each call brings the caller's ID token.
# No port is published: wires dials out.
name: wires-example-k8s

services:
  k8s:
    build:
      context: ..
      target: k8s
      args:
        WIRES_IMAGE: ${WIRES_IMAGE:-wires:dev}
    image: wires-example:k8s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RUST_LOG: ${RUST_LOG:-warn,wires=info}
    configs:
      - source: host-json
        target: /etc/wires-examples/host.json
      - source: roles
        target: /etc/wires-examples/k8s.roles
      - source: ca
        target: /etc/wires-examples/k8s-ca.crt
    tmpfs:
      - /tmp
      # STATE_DIR (host.json): each call's token file, in memory only.
      - /var/lib/wires-examples/k8s:uid=10001,gid=10001,mode=0700
    volumes:
      # The node key and the signed policy: must persist.
      - keystore:/data
    restart: unless-stopped

configs:
  host-json:
    file: ./host.json
  roles:
    file: ./k8s.roles
  # The API server's CA certificate (K8S_CA_FILE in host.json): copy yours
  # here as k8s-ca.crt.
  ca:
    file: ./k8s-ca.crt

volumes:
  keystore:
